name: GitFlow versioning

on:
  push:
    branches:
      - develop
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch name to evaluate
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate and apply branch version
        env:
          VERSION_BRANCH: ${{ inputs.branch || github.ref_name }}
        run: python scripts/version.py --branch "$VERSION_BRANCH" --write
      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/dev/__init__.py
          if git diff --cached --quiet; then
            echo "Version is already current"
          else
            git commit -m "chore: sync version for ${GITHUB_REF_NAME}"
            git push
          fi
